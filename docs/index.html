<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f8f5"><meta name="description" content="デザインスタイル・ゲームUI・モーション・トランジションの見本と特徴・用途・AIへの指示例を確認できます。"><title>FORMA — 表現の引き出し</title><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./games.css"><link rel="stylesheet" href="./motion.css"><link rel="stylesheet" href="./transitions.css"><script type="module" src="./app.js"></script></head>
<body>
<a href="#main" class="skip">コンテンツへ移動</a>
<aside class="sidebar" id="sidebar">
<a class="brand" href="./" aria-label="FORMA ホーム"><span class="brand-mark">✳</span> forma<span class="brand-dot">.</span></a>
<nav aria-label="ライブラリ">
<button class="nav-item active" data-page="styles" aria-current="page"><span data-icon="grid"></span><span>デザインスタイル</span></button>
<button class="nav-item" data-page="games"><span data-icon="game"></span><span>ゲームUI</span></button>
<button class="nav-item" data-page="motion"><span data-icon="motion"></span><span>モーション</span></button>

<div class="workspace"><main id="main">
<section class="catalog" aria-labelledby="catalog-title">
<div class="catalog-heading"><div class="section-title"><button id="menu-button" class="icon-button mobile-only" aria-label="メニューを開く" aria-expanded="false"><span data-icon="menu"></span></button><h1 id="catalog-title">デザインスタイル</h1></div><label class="search-box"><span data-icon="search"></span><input id="search" type="search" placeholder="スタイル・特徴で検索" autocomplete="off" aria-label="スタイル・キーワードを検索"><kbd>/</kbd></label></div>

</main></div>
